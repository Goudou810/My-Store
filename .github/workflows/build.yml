          .tabs button.on{color:var(--ink);font-weight:700}.tabs button.on i{transform:translateY(-2px) scale(1.15)}
          .tabs b{position:absolute;top:0;left:56%;min-width:18px;height:18px;border-radius:9px;background:var(--bad);font-size:11px;display:none;align-items:center;justify-content:center;padding:0 4px}

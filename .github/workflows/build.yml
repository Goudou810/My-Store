name: Construire Mon Store
on:
  push:
    paths-ignore:
      - 'catalogue.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ecrire le projet
        run: |
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/monstore/app app/src/main/res/drawable app/src/main/res/mipmap-anydpi
          cat > settings.gradle <<'EOF_S0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'MonStore'
          include ':app'
          EOF_S0
          cat > app/build.gradle <<'EOF_S1'
          plugins { id 'com.android.application' version '8.5.2' }

          def ksFile = System.getenv('KS_FILE')

          android {
              namespace 'com.monstore.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.monstore.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 100 + (System.getenv('VC') ?: '0').toInteger()
                  versionName '1.0.' + (System.getenv('VC') ?: '0')
              }
              signingConfigs {
                  release {
                      if (ksFile) {
                          storeFile file(ksFile)
                          storeType 'PKCS12'
                          storePassword System.getenv('KS_PASS')
                          keyAlias System.getenv('KS_ALIAS')
                          keyPassword System.getenv('KS_PASS')
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      if (ksFile) signingConfig signingConfigs.release
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF_S1
          cat > app/src/main/AndroidManifest.xml <<'EOF_S2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application
                  android:label="Mon Store"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".InstallReceiver" android:exported="false"/>
              </application>
          </manifest>
          EOF_S2
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF_S3'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#140F3D" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#667C3AED" android:pathData="M96,12m-46,0a46,46 0 1,1 92,0a46,46 0 1,1 -92,0"/>
              <path android:fillColor="#553B82F6" android:pathData="M10,104m-40,0a40,40 0 1,1 80,0a40,40 0 1,1 -80,0"/>
          </vector>
          EOF_S3
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF_S4'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M43,46L43,40A11,11 0 0,1 65,40L65,46"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,46L74,46L77,80Q77.3,85 72,85L36,85Q30.7,85 31,80Z"/>
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#7C3AED"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M54,55L54,73M46,66L54,74L62,66"/>
          </vector>
          EOF_S4
          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF_S5'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF_S5
          cat > app/src/main/assets/catalogue.json <<'EOF_S6'
          {
            "name": "Mon Store",
            "apps": [
              {
                "id": "routine",
                "name": "Ma routine",
                "pkg": "com.routine.app",
                "emoji": "⏱️",
                "colors": ["#7c3aed", "#2563eb"],
                "cat": "Productivité",
                "tagline": "Ta journée en blocs, avec widgets",
                "desc": "Planifie ta journée en blocs d'activités, reçois des rappels au bon moment et garde ta routine sur ton écran d'accueil grâce à 6 styles de widgets.\n\nComptes en ligne et sauvegarde synchronisée.",
                "repo": "Goudou810/My-routine",
                "tag": "apk",
                "apk": "routine.apk",
                "meta": "meta.json",
                "featured": true
              },
              {
                "id": "store",
                "name": "Mon Store",
                "pkg": "com.monstore.app",
                "emoji": "🛍️",
                "colors": ["#ff6bd6", "#7c3aed"],
                "cat": "Système",
                "tagline": "Ce magasin, toujours à jour",
                "desc": "Les mises à jour de Mon Store lui-même.",
                "repo": "__REPO__",
                "tag": "store",
                "apk": "mon-store.apk",
                "meta": "meta.json",
                "self": true
              }
            ]
          }
          EOF_S6
          cat > app/src/main/java/com/monstore/app/MainActivity.java <<'EOF_S7'
          package com.monstore.app;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageInstaller;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ConcurrentHashMap;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              static final String HOST = "appassets.androidplatform.net";
              static MainActivity cur;
              WebView w;
              final ConcurrentHashMap<String, Boolean> cancelled = new ConcurrentHashMap<String, Boolean>();
              final ConcurrentHashMap<String, Boolean> running = new ConcurrentHashMap<String, Boolean>();

              public class Bridge {
                  @JavascriptInterface
                  public String installed(String json) {
                      JSONObject out = new JSONObject();
                      try {
                          JSONArray a = new JSONArray(json);
                          for (int i = 0; i < a.length(); i++) {
                              String p = a.getString(i);
                              try {
                                  PackageInfo pi = getPackageManager().getPackageInfo(p, 0);
                                  long vc = Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode;
                                  JSONObject o = new JSONObject();
                                  o.put("c", vc);
                                  o.put("n", pi.versionName == null ? "" : pi.versionName);
                                  out.put(p, o);
                              } catch (PackageManager.NameNotFoundException e) {
                                  // pas installée
                              }
                          }
                      } catch (Exception e) {
                          // liste invalide
                      }
                      return out.toString();
                  }

                  @JavascriptInterface
                  public boolean canInstall() {
                      return getPackageManager().canRequestPackageInstalls();
                  }

                  @JavascriptInterface
                  public void allowSettings() {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                          Uri.parse("package:" + getPackageName())));
                              } catch (Exception e) {
                                  // réglage indisponible
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void fetch(final String id, final String url) {
                      new Thread(new Runnable() {
                          public void run() {
                              doFetch(id, url);
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void install(final String pkg, final String url) {
                      if (running.containsKey(pkg)) return;
                      running.put(pkg, Boolean.TRUE);
                      cancelled.remove(pkg);
                      new Thread(new Runnable() {
                          public void run() {
                              doInstall(pkg, url);
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void cancel(String pkg) {
                      cancelled.put(pkg, Boolean.TRUE);
                  }

                  @JavascriptInterface
                  public void open(final String pkg) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                                  if (i != null) startActivity(i);
                              } catch (Exception e) {
                                  // impossible d'ouvrir
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void uninstall(final String pkg) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  startActivity(new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + pkg)));
                              } catch (Exception e) {
                                  // impossible de désinstaller
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openUrl(final String url) {
                      if (url == null || !url.startsWith("https://")) return;
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception e) {
                                  // pas de navigateur
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copy(final String text) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                                  cm.setPrimaryClip(ClipData.newPlainText("Mon Store", text));
                              } catch (Exception e) {
                                  // presse-papiers indisponible
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public String info() {
                      JSONObject o = new JSONObject();
                      try {
                          PackageInfo pi = getPackageManager().getPackageInfo(getPackageName(), 0);
                          long vc = Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode;
                          o.put("v", pi.versionName == null ? "" : pi.versionName);
                          o.put("c", vc);
                          o.put("sdk", Build.VERSION.SDK_INT);
                          o.put("model", Build.MODEL);
                      } catch (Exception e) {
                          // infos indisponibles
                      }
                      return o.toString();
                  }
              }

              void js(final String code) {
                  runOnUiThread(new Runnable() {
                      public void run() {
                          if (w != null) w.evaluateJavascript(code, null);
                      }
                  });
              }

              static void result(String pkg, boolean ok, String msg) {
                  MainActivity a = cur;
                  if (pkg == null) return;
                  if (a != null) {
                      a.running.remove(pkg);
                      a.js("window.__d(" + JSONObject.quote(pkg) + "," + ok + "," + JSONObject.quote(msg == null ? "" : msg) + ")");
                  }
              }

              static void ask(String pkg) {
                  MainActivity a = cur;
                  if (a != null && pkg != null) a.js("window.__p(" + JSONObject.quote(pkg) + ",100,\"ask\")");
              }

              void doFetch(String id, String url) {
                  HttpURLConnection c = null;
                  try {
                      if (url == null || !url.startsWith("https://")) throw new IOException("Lien invalide");
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setRequestProperty("User-Agent", "MonStore/1.0");
                      c.setRequestProperty("Cache-Control", "no-cache");
                      int code = c.getResponseCode();
                      if (code < 200 || code >= 300) throw new IOException("HTTP " + code);
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      int total = 0;
                      while ((n = in.read(buf)) > 0) {
                          bo.write(buf, 0, n);
                          total += n;
                          if (total > 2000000) throw new IOException("Fichier trop gros");
                      }
                      in.close();
                      js("window.__f(" + JSONObject.quote(id) + ",true," + JSONObject.quote(bo.toString("UTF-8")) + ")");
                  } catch (Exception e) {
                      js("window.__f(" + JSONObject.quote(id) + ",false," + JSONObject.quote(String.valueOf(e.getMessage())) + ")");
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              void doInstall(String pkg, String url) {
                  HttpURLConnection c = null;
                  PackageInstaller.Session s = null;
                  try {
                      if (url == null || !url.startsWith("https://")) throw new IOException("Lien invalide");
                      PackageInstaller pi = getPackageManager().getPackageInstaller();
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(30000);
                      c.setRequestProperty("User-Agent", "MonStore/1.0");
                      int code = c.getResponseCode();
                      if (code < 200 || code >= 300) throw new IOException(code == 404 ? "APK introuvable (404). Le dépôt est-il public ?" : "Erreur HTTP " + code);
                      long len = c.getContentLengthLong();
                      PackageInstaller.SessionParams p = new PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                      p.setAppPackageName(pkg);
                      if (len > 0) p.setSize(len);
                      int sid = pi.createSession(p);
                      s = pi.openSession(sid);
                      InputStream in = c.getInputStream();
                      OutputStream out = s.openWrite("app.apk", 0, len > 0 ? len : -1);
                      byte[] buf = new byte[65536];
                      int n;
                      long done = 0;
                      int last = -1;
                      long lastT = 0;
                      while ((n = in.read(buf)) > 0) {
                          if (cancelled.containsKey(pkg)) throw new IOException("Annulé");
                          out.write(buf, 0, n);
                          done += n;
                          long now = System.currentTimeMillis();
                          int pct = len > 0 ? (int) (done * 100 / len) : 0;
                          if (pct != last && now - lastT > 120) {
                              last = pct;
                              lastT = now;
                              js("window.__p(" + JSONObject.quote(pkg) + "," + pct + ",\"dl\")");
                          }
                      }
                      s.fsync(out);
                      out.close();
                      in.close();
                      js("window.__p(" + JSONObject.quote(pkg) + ",100,\"inst\")");
                      Intent it = new Intent(this, InstallReceiver.class);
                      it.setAction("com.monstore.app.INSTALL_RESULT");
                      it.putExtra("pkg", pkg);
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= 31) flags |= PendingIntent.FLAG_MUTABLE;
                      PendingIntent pend = PendingIntent.getBroadcast(this, pkg.hashCode(), it, flags);
                      s.commit(pend.getIntentSender());
                      s.close();
                      s = null;
                  } catch (Exception e) {
                      if (s != null) {
                          try {
                              s.abandon();
                          } catch (Exception x) {
                              // session déjà fermée
                          }
                      }
                      running.remove(pkg);
                      String m = e.getMessage() == null ? "Échec du téléchargement" : e.getMessage();
                      js("window.__d(" + JSONObject.quote(pkg) + ",false," + JSONObject.quote(m) + ")");
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              WebResourceResponse asset(Uri u) {
                  if (u == null || !HOST.equals(u.getHost())) return null;
                  String p = u.getPath();
                  if (p == null || p.length() < 2) p = "/index.html";
                  try {
                      InputStream in = getAssets().open(p.substring(1));
                      String mime = p.endsWith(".html") ? "text/html"
                              : p.endsWith(".json") ? "application/json"
                              : p.endsWith(".js") ? "application/javascript"
                              : p.endsWith(".css") ? "text/css"
                              : p.endsWith(".png") ? "image/png"
                              : "application/octet-stream";
                      return new WebResourceResponse(mime, "utf-8", in);
                  } catch (IOException e) {
                      return new WebResourceResponse("text/plain", "utf-8", 404, "Not Found", null,
                              new ByteArrayInputStream(new byte[0]));
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  cur = this;
                  w = new WebView(this);
                  w.setBackgroundColor(0xFF070B1C);
                  getWindow().setStatusBarColor(0xFF070B1C);
                  getWindow().setNavigationBarColor(0xFF070B1C);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setAllowFileAccess(false);
                  w.getSettings().setAllowContentAccess(false);
                  w.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return asset(r.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception e) {
                              // pas de navigateur
                          }
                          return true;
                      }
                  });
                  w.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(w);
                  w.loadUrl("https://" + HOST + "/index.html");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (w != null) w.evaluateJavascript("window.__resume&&window.__resume()", null);
              }

              @Override
              protected void onDestroy() {
                  if (cur == this) cur = null;
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (w.canGoBack()) w.goBack();
                  else finish();
              }
          }
          EOF_S7
          cat > app/src/main/java/com/monstore/app/InstallReceiver.java <<'EOF_S8'
          package com.monstore.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;

          public class InstallReceiver extends BroadcastReceiver {
              static String human(int st, String msg) {
                  switch (st) {
                      case PackageInstaller.STATUS_FAILURE_ABORTED:
                          return "Installation annulée";
                      case PackageInstaller.STATUS_FAILURE_BLOCKED:
                          return "Installation bloquée (autorisation ou Play Protect)";
                      case PackageInstaller.STATUS_FAILURE_CONFLICT:
                          return "Conflit : une version signée avec une autre clé est déjà installée. Désinstalle-la d'abord.";
                      case PackageInstaller.STATUS_FAILURE_INCOMPATIBLE:
                          return "App incompatible avec cet appareil";
                      case PackageInstaller.STATUS_FAILURE_INVALID:
                          return "APK invalide ou paquet différent de celui du catalogue";
                      case PackageInstaller.STATUS_FAILURE_STORAGE:
                          return "Espace de stockage insuffisant";
                      default:
                          return msg == null || msg.length() == 0 ? "Échec de l'installation" : msg;
                  }
              }

              @Override
              public void onReceive(Context c, Intent in) {
                  int st = in.getIntExtra(PackageInstaller.EXTRA_STATUS, -1);
                  String pkg = in.getStringExtra("pkg");
                  if (pkg == null) pkg = in.getStringExtra(PackageInstaller.EXTRA_PACKAGE_NAME);
                  String msg = in.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE);
                  if (st == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent confirm = in.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (confirm != null) {
                          confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          try {
                              c.startActivity(confirm);
                          } catch (Exception e) {
                              // impossible d'afficher la confirmation
                          }
                      }
                      MainActivity.ask(pkg);
                  } else if (st == PackageInstaller.STATUS_SUCCESS) {
                      MainActivity.result(pkg, true, "");
                  } else {
                      MainActivity.result(pkg, false, human(st, msg));
                  }
              }
          }
          EOF_S8
          cat > app/src/main/assets/index.html <<'EOF_S9'
          <!doctype html>
          <html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
          <meta name="theme-color" content="#070b1c"><title>Mon Store</title>
          <style>
          :root{--bg:#070b1c;--sf:rgba(255,255,255,.06);--sf2:rgba(255,255,255,.1);--ln:rgba(255,255,255,.12);--ink:#eef1ff;--mu:#9aa6d6;--c1:#b06bff;--c2:#3b8cff;--ok:#34e0a1;--warn:#ffb347;--bad:#ff6b6b;--r:20px}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
          button,input,textarea{font:inherit;color:inherit}
          button{border:0;background:none;cursor:pointer}
          .fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;transition:transform .6s ease-out}
          .fx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45}
          .o1{width:300px;height:300px;background:var(--c1);left:-80px;top:-60px;animation:fl 14s ease-in-out infinite alternate}
          .o2{width:340px;height:340px;background:var(--c2);right:-120px;bottom:60px;animation:fl 17s ease-in-out infinite alternate-reverse}
          @keyframes fl{to{transform:translate(40px,60px) scale(1.15)}}
          .app{position:relative;display:flex;flex-direction:column;height:100%}
          header{display:flex;align-items:center;gap:12px;padding:16px 18px 8px}
          .logo{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 24px -8px var(--c1)}
          .ht{flex:1}.ht b{font-size:20px;display:block}.ht small{color:var(--mu)}
          .ib{width:42px;height:42px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);font-size:20px}
          .ib.spin{animation:sp 1s linear infinite}
          @keyframes sp{to{transform:rotate(360deg)}}
          main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 24px;-webkit-overflow-scrolling:touch}
          .pg{display:none}.pg.on{display:block;animation:pop .35s ease}
          @keyframes pop{from{opacity:0;transform:translateY(10px)}}
          .sb{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);margin:6px 0 12px}
          .sb input{flex:1;background:none;border:0;outline:none;padding:13px 0;font-size:16px}
          .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
          .chips::-webkit-scrollbar{display:none}

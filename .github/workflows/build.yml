          .row2{display:flex;gap:10px;margin-top:14px}.row2 .act{flex:1}
          .set{padding:16px;border-radius:var(--r);background:var(--sf);border:1px solid var(--ln);margin-bottom:12px}
          .set b{display:block;margin-bottom:4px}.set p{margin:0 0 10px;color:var(--mu)}
          .ok-t{color:var(--ok)}.bad-t{color:var(--warn)}
          .frm input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);outline:none;margin-bottom:8px;font-size:15px}
          pre{background:#060a1a;border:1px solid var(--ln);border-radius:14px;padding:12px;overflow:auto;max-height:200px;font-size:11px;white-space:pre-wrap;word-break:break-all}
          #toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,30px);opacity:0;max-width:88vw;padding:12px 18px;border-radius:16px;background:rgba(20,25,60,.96);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:600;font-size:14px;text-align:center;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.3)}
          #toast.on{opacity:1;transform:translate(-50%,0)}
          #cf{position:fixed;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}
          #splash{position:fixed;inset:0;z-index:100;background:#070b1c;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
          #splash.off{opacity:0;pointer-events:none}
          #splash span{font-size:56px;animation:bob 2.2s ease-in-out infinite}
          @keyframes bob{50%{transform:translateY(-10px)}}
          @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
          </style></head>
          <body>
          <div id="splash"><span>🛍️</span></div>
          <div class="fx" id="fx"><i class="o1"></i><i class="o2"></i></div>
          <div class="app">
           <header><div class="logo">🛍️</div><div class="ht"><b id="ttl">Mon Store</b><small id="sub">Chargement…</small></div><button id="rf" class="ib" aria-label="Actualiser">⟳</button></header>
           <main id="main">
            <section id="p-explore" class="pg on">
             <div id="ubar"></div>
             <div class="sb"><span>🔍</span><input id="q" placeholder="Rechercher une app" autocomplete="off"></div>
             <div class="chips" id="cats"></div>
             <div id="hero"></div>
             <div class="st" id="lt">Toutes les apps</div>
             <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
            </section>
            <section id="p-mine" class="pg"><div id="mine"></div></section>
            <section id="p-set" class="pg"><div id="set"></div></section>
           </main>
           <nav class="tabs">
            <button data-t="explore" class="on"><i>🧭</i>Explorer</button>
            <button data-t="mine"><i>📲</i>Mes apps<b id="badge"></b></button>
            <button data-t="set"><i>⚙️</i>Réglages</button>
           </nav>
          </div>
          <div id="sheet" class="sheet"><div class="sc" id="sc"></div></div>
          <div id="toast"></div>
          <canvas id="cf"></canvas>
          <script>
          const REPO="__REPO__",BRANCH="__BRANCH__";
          const $=id=>document.getElementById(id);
          const AND=typeof Android!=="undefined"?Android:null;
          const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
          let CAT={apps:[]},META={},INST={},BUSY={},CAN=true,FILTER="Tout",QRY="",TAB="explore",SHEET="",QUEUE=[],LASTLOAD=0,OFFLINE=false;
          function splashOff(){const e=$("splash");if(e)e.classList.add("off")}
          setTimeout(splashOff,3500);
          function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
          let toastT=0;
          function toast(t,ms){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),ms||2600)}
          const CF=[];let cfRun=false;
          function burst(n){
           const c=$("cf"),w=c.width=innerWidth,h=c.height=innerHeight;
           const cols=["#b06bff","#3b8cff","#34e0a1","#ffb347","#ff5a1f","#ff6bd6"];
           for(let i=0;i<(n||90);i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;CF.push({x:w/2,y:h*.4,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],l:70+Math.random()*50})}
           if(!cfRun){cfRun=true;requestAnimationFrame(cfLoop)}}
          function cfLoop(){
           const c=$("cf"),g=c.getContext("2d");g.clearRect(0,0,c.width,c.height);
           for(let i=CF.length-1;i>=0;i--){const p=CF[i];p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;
            if(p.l<=0||p.y>c.height+20){CF.splice(i,1);continue}
            g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=Math.min(1,p.l/30);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);g.restore()}
           if(CF.length)requestAnimationFrame(cfLoop);else{cfRun=false;g.clearRect(0,0,c.width,c.height)}}

          /* ---------- réseau (via Java pour éviter les blocages CORS) ---------- */
          const CB={};let cbN=0;
          window.__f=function(id,ok,txt){const c=CB[id];if(!c)return;delete CB[id];if(ok)c.res(txt);else c.rej(new Error(txt))};
          function jfetch(url){
           if(!AND)return fetch(url,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()});
           return new Promise((res,rej)=>{const id="f"+(++cbN);CB[id]={res:res,rej:rej};AND.fetch(id,url)})}
          function tryJson(t){try{return JSON.parse(t)}catch(e){return null}}
          async function loadCatalogue(){
           let j=null;
           if(REPO.indexOf("/")>0){try{j=tryJson(await jfetch("https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/catalogue.json?t="+Date.now()))}catch(e){}}
           if(!j||!Array.isArray(j.apps)){try{j=tryJson(await (await fetch("catalogue.json")).text())}catch(e){}}
           if(j&&Array.isArray(j.apps)){CAT=j;CAT.apps=j.apps.filter(a=>a&&a.id&&a.pkg&&a.name);return true}
           return false}
          const rel=(a,f)=>"https://github.com/"+a.repo+"/releases/download/"+encodeURIComponent(a.tag||"apk")+"/"+encodeURIComponent(f);
          const apkUrl=a=>a.apkUrl||rel(a,a.apk||"app.apk");
          const metaUrl=a=>a.metaUrl||(a.repo&&a.meta!==""?rel(a,a.meta||"meta.json"):"");
          async function loadMetas(){
           let fails=0;
           await Promise.all(CAT.apps.map(async a=>{
            const u=metaUrl(a);let m=null;
            if(u){try{m=tryJson(await jfetch(u))}catch(e){fails++}}
            META[a.id]=m&&typeof m==="object"?m:null}));
           OFFLINE=CAT.apps.length>0&&fails===CAT.apps.length}

          /* ---------- état des apps ---------- */
          const byId=id=>CAT.apps.find(a=>a.id===id);
          const byPkg=p=>CAT.apps.find(a=>a.pkg===p);
          function refreshInstalled(){
           if(!AND){INST={};return}
           try{INST=JSON.parse(AND.installed(JSON.stringify(CAT.apps.map(a=>a.pkg))))||{}}catch(e){INST={}}
           try{CAN=!!AND.canInstall()}catch(e){}}
          function remoteCode(a){const m=META[a.id]||{};return +m.versionCode||+a.versionCode||0}
          function remoteName(a){const m=META[a.id]||{};return m.versionName||a.version||""}
          function status(a){
           const i=INST[a.pkg];
           if(!i)return"new";
           const rc=remoteCode(a);
           return rc&&rc>i.c?"upd":"ok"}
          function fmtSize(b){b=+b||0;if(!b)return"";return b>=1048576?(b/1048576).toFixed(1).replace(".",",")+" Mo":Math.max(1,Math.round(b/1024))+" Ko"}
          const okColor=c=>/^#[0-9a-fA-F]{3,8}$/.test(c);
          function grad(a){const c=a.colors||[];return"linear-gradient(135deg,"+(okColor(c[0])?c[0]:"#7c3aed")+","+(okColor(c[1])?c[1]:"#2563eb")+")"}
          function tile(a,lg){
           const img=/^https:\/\//.test(a.icon||"");
           return'<div class="tile'+(lg?" lg":"")+'" style="background:'+grad(a)+'">'+(img?'<img src="'+esc(a.icon)+'" alt="">':esc(a.emoji||"📦"))+'</div>'}
          function btn(a,big){
           const b=BUSY[a.id];
           if(b)return'<div class="pb'+(big?" big":"")+'"><i style="width:'+b.p+'%"></i><span>'+esc(b.txt)+'</span><button class="x" data-act="cancel" data-id="'+esc(a.id)+'" aria-label="Annuler">✕</button></div>';
           const s=status(a);
           return'<button class="act '+s+(big?" big":"")+'" data-act="'+(s==="ok"?"open":"install")+'" data-id="'+esc(a.id)+'">'+(s==="new"?"Installer":s==="upd"?"Mettre à jour":"Ouvrir")+'</button>'}
          function verLine(a){
           const s=status(a),i=INST[a.pkg],vn=remoteName(a),m=META[a.id]||{};
           if(s==="upd")return'<span class="tag upd">MAJ</span>'+esc((i&&i.n)||"")+" → "+esc(vn);
           if(s==="ok")return'<span class="tag ok">Installé</span>'+esc((i&&i.n)||vn);
           return'<span class="tag new">'+(vn?"v"+esc(vn):"Disponible")+'</span>'+esc(fmtSize(m.size))}
          function paint(id){
           const a=byId(id);if(!a)return;
           const L=document.querySelectorAll('[data-slot="'+id+'"]');
           for(let k=0;k<L.length;k++)L[k].innerHTML=btn(a,L[k].dataset.big==="1")}

          /* ---------- rendu ---------- */
          function visible(){
           const q=QRY.trim().toLowerCase();
           return CAT.apps.filter(a=>(FILTER==="Tout"||a.cat===FILTER)&&(!q||(a.name+" "+(a.tagline||"")+" "+(a.cat||"")).toLowerCase().indexOf(q)>=0))}
          function card(a,i){
           return'<div class="card" style="--d:'+Math.min(i,8)*45+'ms" data-open="'+esc(a.id)+'">'+tile(a)+'<div class="ci"><b>'+esc(a.name)+'</b><small>'+esc(a.tagline||a.cat||"")+'</small><div class="vs">'+verLine(a)+'</div></div><div data-slot="'+esc(a.id)+'">'+btn(a)+'</div></div>'}
          function rExplore(){
           const cats=["Tout"].concat(CAT.apps.map(a=>a.cat).filter((c,i,t)=>c&&t.indexOf(c)===i));
           if(cats.indexOf(FILTER)<0)FILTER="Tout";
           $("cats").innerHTML=cats.map(c=>'<button class="chip'+(c===FILTER?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("");
           const self=CAT.apps.find(a=>a.self);
           $("ubar").innerHTML=self&&status(self)==="upd"?'<div class="ub"><div><b>Mise à jour du Store</b><small>Version '+esc(remoteName(self))+' disponible</small></div><span data-slot="'+esc(self.id)+'">'+btn(self)+'</span></div>':"";
           const f=!QRY&&FILTER==="Tout"?CAT.apps.find(a=>a.featured):null;
           $("hero").innerHTML=f?'<div class="hero" style="background:'+grad(f)+'" data-open="'+esc(f.id)+'"><div class="big">'+esc(f.emoji||"📦")+'</div><small>À la une</small><h2>'+esc(f.name)+'</h2><p>'+esc(f.tagline||"")+'</p><div data-slot="'+esc(f.id)+'">'+btn(f)+'</div></div>':"";
           const L=visible();
           $("lt").textContent=QRY?L.length+" résultat"+(L.length>1?"s":""):FILTER==="Tout"?"Toutes les apps":FILTER;
           $("list").innerHTML=L.length?L.map(card).join(""):'<div class="empty"><span class="e">🔎</span>Aucune app trouvée</div>'}
          function rMine(){
           const L=CAT.apps.filter(a=>INST[a.pkg]).sort((a,b)=>(status(b)==="upd")-(status(a)==="upd"));
           const n=L.filter(a=>status(a)==="upd").length;
           let h="";
           if(n)h+='<div class="ub"><div><b>'+n+' mise'+(n>1?"s":"")+' à jour disponible'+(n>1?"s":"")+'</b><small>Installation une par une</small></div><button class="act upd" data-act="updall">Tout mettre à jour</button></div>';
           h+=L.length?L.map(card).join(""):'<div class="empty"><span class="e">📭</span>Aucune app du catalogue n\'est installée.<br>Va dans Explorer pour en installer.</div>';
           $("mine").innerHTML=h;
           const b=$("badge");b.textContent=n;b.classList.toggle("on",n>0)}
          function rSet(){
           let inf={};try{if(AND)inf=JSON.parse(AND.info())}catch(e){}
           const self=CAT.apps.find(a=>a.self);
           $("set").innerHTML=
            '<div class="set"><b>Autorisation d\'installer</b><p>'+(AND?(CAN?'<span class="ok-t">✓ Activée.</span> Le Store peut installer et mettre à jour tes apps.':'<span class="bad-t">Désactivée.</span> Android demande d\'autoriser « Installer des applis inconnues » pour Mon Store.'):'Disponible dans l\'application Android.')+'</p>'+(AND&&!CAN?'<button class="act" data-act="perm">Ouvrir le réglage</button>':'')+'</div>'+
            '<div class="set"><b>Catalogue</b><p>'+esc(CAT.apps.length)+' app(s)'+(REPO.indexOf("/")>0?' · source : '+esc(REPO)+' ('+esc(BRANCH)+')':'')+(OFFLINE?'<br><span class="bad-t">Hors ligne : versions non vérifiées.</span>':'')+'</p><button class="act ok" data-act="refresh">Actualiser</button></div>'+
            '<div class="set"><b>Ajouter une app au catalogue</b><p>Remplis un petit formulaire, le Store te donne le texte à coller dans <i>catalogue.json</i>.</p><button class="act" data-act="addform">Ajouter une app</button></div>'+
            '<div class="set"><b>Mon Store</b><p>Version '+esc(inf.v||"—")+(inf.sdk?' · Android '+esc(inf.sdk):'')+(self&&status(self)==="upd"?'<br><span class="bad-t">Version '+esc(remoteName(self))+' disponible.</span>':'')+'</p>'+(self&&status(self)==="upd"?'<span data-slot="'+esc(self.id)+'">'+btn(self)+'</span>':'')+'</div>'+
            '<div class="set"><b>À savoir</b><p>N\'installe que des apps dont tu es l\'auteur ou dont tu as le droit de diffuser l\'APK. Les mises à jour ne fonctionnent que si l\'app est signée avec la même clé que la version installée.</p></div>'}
          function render(){rExplore();rMine();if(TAB==="set")rSet()}
          function go(t){
           TAB=t;vib(8);
           document.querySelectorAll(".pg").forEach(p=>p.classList.toggle("on",p.id==="p-"+t));
           document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
           if(t==="set")rSet();$("main").scrollTop=0}

          /* ---------- fiche détaillée ---------- */
          function sheetHtml(a){
           const m=META[a.id]||{},i=INST[a.pkg],notes=m.notes||a.notes||"",vn=remoteName(a);
           const shots=(a.shots||[]).filter(u=>/^https:\/\//.test(u));
           return'<div class="hd"></div><div class="sh">'+tile(a,true)+'<div><h2>'+esc(a.name)+'</h2><small>'+esc(a.author||a.cat||"")+'</small></div></div>'+
            '<div data-slot="'+esc(a.id)+'" data-big="1">'+btn(a,true)+'</div>'+
            '<div class="stats"><div><b>'+esc(vn||"—")+'</b><small>Version</small></div><div><b>'+esc(fmtSize(m.size)||"—")+'</b><small>Taille</small></div><div><b>'+esc(a.cat||"—")+'</b><small>Catégorie</small></div></div>'+
            (shots.length?'<div class="shots">'+shots.map(u=>'<img loading="lazy" src="'+esc(u)+'" alt="">').join("")+'</div>':"")+
            '<div class="sec">Description</div><div class="txt">'+esc(a.desc||a.tagline||"Aucune description.")+'</div>'+
            (notes?'<div class="sec">Nouveautés</div><div class="txt">'+esc(notes)+'</div>':"")+
            (i?'<div class="sec">Sur ton téléphone</div><div class="txt">Version installée : '+esc(i.n||"?")+' (build '+esc(i.c)+')</div>':"")+
            '<div class="row2">'+(i?'<button class="act ok" data-act="uninstall" data-id="'+esc(a.id)+'">Désinstaller</button>':"")+'<button class="act ok" data-act="share" data-id="'+esc(a.id)+'">Copier le lien</button></div>'}
          function openSheet(id){
           const a=byId(id);if(!a)return;
           SHEET=id;$("sc").innerHTML=sheetHtml(a);$("sheet").classList.add("on");
           try{history.pushState({s:1},"")}catch(e){}}
          function refreshSheet(){const a=byId(SHEET);if(a&&$("sheet").classList.contains("on"))$("sc").innerHTML=sheetHtml(a)}
          function hideSheet(){SHEET="";$("sheet").classList.remove("on")}
          function closeSheet(){if(!SHEET)return;let ok=false;try{history.back();ok=true}catch(e){}if(!ok)hideSheet()}
          window.addEventListener("popstate",hideSheet);

          /* ---------- installation ---------- */
          function startInstall(a){
           if(BUSY[a.id])return;
           if(!AND){window.open(apkUrl(a),"_blank");return}
           if(!AND.canInstall()){CAN=false;toast("Autorise d'abord l'installation pour Mon Store");vib(30);AND.allowSettings();return}
           BUSY[a.id]={p:0,txt:"Connexion…"};paint(a.id);
           AND.install(a.pkg,apkUrl(a))}
          window.__p=function(pkg,p,st){
           const a=byPkg(pkg);if(!a)return;
           const b=BUSY[a.id]||(BUSY[a.id]={p:0,txt:""});
           b.p=p;b.txt=st==="dl"?"Téléchargement "+p+"%":st==="inst"?"Installation…":st==="ask"?"Confirme l'installation":"…";
           paint(a.id)};
          window.__d=function(pkg,ok,msg){
           const a=byPkg(pkg);if(!a)return;
           delete BUSY[a.id];refreshInstalled();
           if(ok){burst(90);vib([50,40,50]);toast("✅ "+a.name+" est installé !")}
           else{if(/annul/i.test(msg||""))QUEUE=[];toast("⚠ "+(msg||"Échec de l'installation"),4200);vib(60)}
           render();if(TAB==="set")rSet();if(SHEET)refreshSheet();
           nextQueue()};
          window.__resume=function(){refreshInstalled();render();if(TAB==="set")rSet();if(SHEET)refreshSheet()};
          function nextQueue(){
           if(Object.keys(BUSY).length||!QUEUE.length)return;
           const a=byId(QUEUE.shift());if(a)startInstall(a)}
          function act(name,id){
           const a=id?byId(id):null;
           if(name==="install"&&a)startInstall(a);
           else if(name==="open"&&a){if(AND)AND.open(a.pkg);else toast("Disponible dans l'app Android")}
           else if(name==="cancel"&&a){QUEUE=[];if(AND)AND.cancel(a.pkg);const b=BUSY[a.id];if(b)b.txt="Annulation…";paint(a.id)}
           else if(name==="uninstall"&&a){if(AND)AND.uninstall(a.pkg)}
           else if(name==="share"&&a){const u=apkUrl(a);if(AND)AND.copy(u);else try{navigator.clipboard.writeText(u)}catch(e){}toast("Lien de téléchargement copié")}
           else if(name==="updall"){QUEUE=CAT.apps.filter(x=>status(x)==="upd"&&!BUSY[x.id]).map(x=>x.id);nextQueue()}
           else if(name==="perm"){if(AND)AND.allowSettings()}
           else if(name==="refresh")reload(true)
           else if(name==="addform")openAdd()}

          /* ---------- formulaire d'ajout ---------- */
          function openAdd(){
           SHEET="add";
           $("sc").innerHTML='<div class="hd"></div><div class="sh"><div class="tile lg" style="background:'+grad({})+'">➕</div><div><h2>Ajouter une app</h2><small>Génère le catalogue à jour</small></div></div>'+
            '<div class="frm"><input id="f_name" placeholder="Nom (ex : Mon Journal)"><input id="f_pkg" placeholder="Package (ex : com.exemple.journal)" autocapitalize="none"><input id="f_repo" placeholder="Dépôt GitHub (ex : pseudo/mon-depot)" autocapitalize="none"><input id="f_apk" placeholder="Fichier APK (ex : journal.apk)" autocapitalize="none"><input id="f_tag" placeholder="Tag de la release (défaut : apk)" autocapitalize="none"><input id="f_emoji" placeholder="Emoji (ex : 📓)"><input id="f_cat" placeholder="Catégorie (ex : Productivité)"><input id="f_desc" placeholder="Description courte"></div>'+
            '<div class="sec">Résultat à coller dans catalogue.json</div><pre id="f_out"></pre>'+
            '<div class="row2"><button class="act" data-act="copycat">Copier le catalogue</button></div>'+
            '<p class="txt" style="margin-top:12px">Dans ton dépôt du Store, crée (ou modifie) le fichier <b>catalogue.json</b> et remplace tout son contenu par ce texte. L\'app le recharge toute seule, sans nouvelle version.</p>';
           $("sheet").classList.add("on");
           try{history.pushState({s:1},"")}catch(e){}
           ["f_name","f_pkg","f_repo","f_apk","f_tag","f_emoji","f_cat","f_desc"].forEach(i=>$(i).addEventListener("input",genJson));
           genJson()}
          function genEntry(){
           const v=i=>$(i).value.trim(),name=v("f_name"),pkg=v("f_pkg"),repo=v("f_repo");
           if(!name||!pkg||!repo)return null;
           const e={id:pkg.split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"")||"app"+Date.now(),name:name,pkg:pkg,emoji:v("f_emoji")||"📦",colors:["#7c3aed","#2563eb"],cat:v("f_cat")||"Divers",tagline:v("f_desc"),desc:v("f_desc"),repo:repo,tag:v("f_tag")||"apk",apk:v("f_apk")||"app.apk",meta:"meta.json"};
           return e}
          function genJson(){
           const e=genEntry(),apps=CAT.apps.slice();
           if(e)apps.push(e);
           $("f_out").textContent=JSON.stringify({name:CAT.name||"Mon Store",apps:apps},null,2)}
          function copyCat(){
           const t=$("f_out").textContent;
           if(!genEntry()){toast("Remplis au moins le nom, le package et le dépôt");return}
           if(AND)AND.copy(t);else try{navigator.clipboard.writeText(t)}catch(e){}
           toast("Catalogue copié, colle-le dans catalogue.json",3200);vib(20)}

          /* ---------- événements ---------- */
          document.addEventListener("click",e=>{
           const t=e.target;if(!t.closest)return;
           const b=t.closest("[data-act]");
           if(b){e.stopPropagation();if(b.dataset.act==="copycat")copyCat();else act(b.dataset.act,b.dataset.id);return}
           const c=t.closest("[data-open]");if(c){openSheet(c.dataset.open);return}
           const ch=t.closest("[data-cat]");if(ch){FILTER=ch.dataset.cat;vib(8);rExplore();return}
           const tb=t.closest("[data-t]");if(tb){go(tb.dataset.t);return}
           if(t===$("sheet"))closeSheet()});
          $("q").addEventListener("input",()=>{QRY=$("q").value;rExplore()});
          $("rf").addEventListener("click",()=>reload(true));
          document.addEventListener("visibilitychange",()=>{if(!document.hidden)window.__resume()});

          async function reload(manual){
           const rf=$("rf");rf.classList.add("spin");
           const ok=await loadCatalogue();
           refreshInstalled();render();
           await loadMetas();
           refreshInstalled();LASTLOAD=Date.now();render();if(TAB==="set")rSet();if(SHEET&&SHEET!=="add")refreshSheet();
           $("ttl").textContent=CAT.name||"Mon Store";
           $("sub").textContent=CAT.apps.length+" app"+(CAT.apps.length>1?"s":"")+(OFFLINE||!ok?" · hors ligne":"");
           rf.classList.remove("spin");
           if(manual)toast(OFFLINE?"Hors ligne : versions non vérifiées":"Catalogue à jour ✓")}
          (async function(){
           const ok=await loadCatalogue();
           refreshInstalled();render();splashOff();
           await loadMetas();
           refreshInstalled();LASTLOAD=Date.now();render();
           $("ttl").textContent=CAT.name||"Mon Store";
           $("sub").textContent=CAT.apps.length+" app"+(CAT.apps.length>1?"s":"")+(OFFLINE||!ok?" · hors ligne":"")})();
          </script></body></html>
          EOF_S9
      - name: Catalogue et depot
        run: |
          if [ -f catalogue.json ]; then cp catalogue.json app/src/main/assets/catalogue.json; fi
          python3 - <<'PY'
          import json, os, sys
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          branch = os.environ.get("GITHUB_REF_NAME", "main")
          for p in ("app/src/main/assets/index.html", "app/src/main/assets/catalogue.json"):
              t = open(p, encoding="utf-8").read()
              t = t.replace("__REPO__", repo).replace("__BRANCH__", branch)
              open(p, "w", encoding="utf-8").write(t)
          try:
              j = json.load(open("app/src/main/assets/catalogue.json", encoding="utf-8"))
              assert isinstance(j.get("apps"), list)
          except Exception as e:
              print("::error::catalogue.json invalide :", e)
              sys.exit(1)
          print("Depot :", repo, branch, "-", len(j["apps"]), "app(s)")
          PY
      - name: Cle de signature
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS_SECRET" ]; then
            echo "Cle de signature : secrets GitHub"
            PASS="$KS_PASS_SECRET"
          else
            echo "Cle de signature : cle integree (aucun secret configure)"
            KS_B64=""
            PASS="NlXmfWJAM9ctuRZofPV0pUUU"
          fi
          echo "$KS_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/routine.p12"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
      - name: Compiler
        env:
          KS_FILE: ${{ runner.temp }}/routine.p12
          KS_ALIAS: routine
          VC: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk mon-store.apk
          python3 - <<'PY'
          import json, os, subprocess
          run = os.environ["GITHUB_RUN_NUMBER"]
          msg = subprocess.run(["git", "log", "-1", "--pretty=%s"], capture_output=True, text=True).stdout.strip()
          meta = {"package": "com.monstore.app", "versionCode": 100 + int(run), "versionName": "1.0." + run, "size": os.path.getsize("mon-store.apk"), "notes": msg}
          json.dump(meta, open("meta.json", "w"), ensure_ascii=False)
          PY
          gh release delete store -y --cleanup-tag || true
          gh release create store mon-store.apk meta.json --title "Mon Store" --notes "APK de Mon Store"
